name: Tests and release checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: audioseyx --self-test --report self-test.json
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 14
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python tools/audit_distribution.py dist
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Install and smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          python tools/smoke_installed.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
