name: Publish Python package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.4.0a1
        required: true
        type: string
      target:
        description: Package index destination
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - run: python tools/check_release_tag.py
      - run: python -m pip install ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python tools/audit_distribution.py dist
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-distributions
          path: dist
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
